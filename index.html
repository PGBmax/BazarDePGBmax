<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hub — RSL Tier Lists</title>
  <link rel="shortcut icon" href="https://www.coupcritique.fr/images/types/icon/normal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0f0f13;
      color: #e8e6f0;
      min-height: 100vh;
    }

    header {
      background: rgba(15, 15, 20, 0.98);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      padding: 32px 40px;
      text-align: center;
    }

    h1 {
      font-size: 2.4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #7b8cde 0%, #a78bfa 50%, #60a5fa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    .subtitle {
      color: rgba(232, 230, 240, 0.4);
      font-size: 0.8rem;
      font-weight: 500;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    main {
      padding: 48px 32px 64px;
      max-width: 980px;
      margin: 0 auto;
    }

    .section-label {
      text-align: center;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(167, 139, 250, 0.6);
      margin-bottom: 28px;
    }

    .site-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 18px;
    }

    .site-card {
      background: #16161f;
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 26px 16px 20px;
      text-decoration: none;
      color: #e8e6f0;
      transition: background 0.25s ease, border-color 0.25s ease, transform 0.25s ease, box-shadow 0.25s ease;
      text-align: center;
      cursor: pointer;
    }

    .site-card:hover {
      background: #1e1e2e;
      border-color: rgba(167, 139, 250, 0.45);
      transform: translateY(-5px);
      box-shadow: 0 12px 36px rgba(100, 80, 200, 0.22);
    }

    .site-card img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 12px;
      margin-bottom: 14px;
      transition: transform 0.25s ease;
    }

    .site-card:hover img {
      transform: scale(1.08);
    }

    .site-card span {
      font-size: 0.88rem;
      font-weight: 600;
      letter-spacing: 0.3px;
      color: rgba(232, 230, 240, 0.9);
    }

    .site-card.special {
      border-color: rgba(255, 107, 157, 0.18);
    }

    .site-card.special:hover {
      border-color: rgba(255, 107, 157, 0.5);
      box-shadow: 0 12px 36px rgba(255, 80, 100, 0.2);
    }

    @media (max-width: 600px) {
      header {
        padding: 22px 20px;
      }

      h1 {
        font-size: 1.7rem;
      }

      main {
        padding: 28px 14px 48px;
      }

      .site-grid {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .site-card {
        padding: 18px 10px 14px;
        border-radius: 12px;
      }

      .site-card img {
        width: 64px;
        height: 64px;
        margin-bottom: 10px;
        border-radius: 10px;
      }

      .site-card span {
        font-size: 0.8rem;
      }
    }

    @media (max-width: 360px) {
      .site-grid {
        gap: 10px;
      }

      .site-card img {
        width: 56px;
        height: 56px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Tier List Maker for RSL</h1>
    <p class="subtitle">Raid: Shadow Legends</p>
  </header>

  <main>
    <p class="section-label">Choisir une catégorie</p>
    <div class="site-grid">
      <a href="Reliques/" class="site-card">
        <img src="Reliques/images/36.png" alt="Reliques">
        <span>Reliques</span>
      </a>
      <a href="Joyaux/" class="site-card">
        <img src="Joyaux/images/01.png" alt="Joyaux">
        <span>Joyaux</span>
      </a>
      <a href="Mythiques/" class="site-card">
        <img src="Mythiques/images/02.png" alt="Mythiques">
        <span>Mythiques</span>
      </a>
      <a href="leg_void/" class="site-card">
        <img src="leg_void/images/12.png" alt="Leg Void">
        <span>Leg Void</span>
      </a>
      <a href="lead_faction/" class="site-card">
        <img src="lead_faction/images/09.png" alt="Lead Faction">
        <span>Lead Faction</span>
      </a>
      <a href="Ups/" class="site-card">
        <img src="Ups/images/51.png" alt="Ups">
        <span>Ups</span>
      </a>
      <a href="Fusions/" class="site-card">
        <img src="Fusions/images/80.png" alt="Fusions">
        <span>Fusions</span>
      </a>
      <a href="Revivers/" class="site-card">
        <img src="Revivers/images/10.png" alt="Revivers">
        <span>Revivers</span>
      </a>
      <a href="SmashOrPass/" class="site-card special">
        <img src="SmashOrPass/images/10.png" alt="Smash Or Pass">
        <span>Smash Or Pass</span>
      </a>
    </div>
  </main>
</body>
</html>
