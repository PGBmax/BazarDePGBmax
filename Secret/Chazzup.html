<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edgard Maitre Singe</title>
  <link rel="shortcut icon" href="assets/faction.png">
  <link rel="stylesheet" href="assets/legendary.css">
  <!-- Registre des thèmes de faction -->
  <script src="assets/faction-theme-registry.js"></script>
</head>
<body>
  <!-- Bouton retour responsive : fixe sur desktop, en haut sur mobile -->
  
  <div class="container">
    <div class="left-panel panel">
      <h2 class="champion-name">Edgard Maitre Singe</h2>
      <div class="champion-info">
        <div class="info-group">
          <div class="rarity-box">Légendaire</div>
          <div class="type-badge" id="champion-type">Défense</div>
        </div>
        <div class="info-group">
          <img src="assets/affi.png" alt="Spirit" class="affinity-img">
        </div>
      </div>
      <div class="champion-image-container">
        <img src="assets/Chazzup.png" alt="Edgard Maitre Singe" class="champion-img">
      </div>
    </div>

    <div class="middle-panel panel">
      <h3 style="text-align: center; color: #e6b800; margin-bottom: 1.5rem;">Compétences</h3>
      <div class="spells-container" id="spells-section">
        <!-- Les sorts seront générés par JavaScript -->
      </div>
      <div class="aura-container">
        <div class="aura">
          <img src="" alt="Aura" class="aura-img" id="aura-img">
        </div>
        <!-- La description mobile de l'aura sera ajoutée ici par JavaScript -->
      </div>
    </div>

    <div class="right-panel panel">
      <div class="stats">
        <h3>Statistiques</h3>
        <div class="stat-block" id="stats-content"></div>
      </div>
    </div>
  </div>

  <!-- Tooltip pour desktop uniquement -->
  <div id="tooltip" class="tooltip"></div>
  <script src="assets/constant.js"></script><script src="Chazzup.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      if (window.FactionThemes) {
        window.FactionThemes.apply('tortues-ninja');
      }
    });
  </script>
</body>
</html>
